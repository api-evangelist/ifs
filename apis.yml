x-api-base:
  note: >-
    apis[].baseURL was https://api.ifs.com on all seven entries. That host resolves (193.41.170.171) but
    returns HTTP 503 for every path, and IFS documents it nowhere. IFS Cloud APIs are OData v4 projection
    services hosted in each customer's own environment; the documented endpoint shape is https://<system-url>/main/ifsapplications/projection/v1/<Projection>.svc,
    evidenced by the @odata.context in IFS's own Script-A-Rest sample response. The templated base is
    recorded instead of a host that does not serve.
  evidence:
  - url: https://api.ifs.com/
    status: 503
  - url: https://docs.ifs.com/techdocs/26r1/060_development/050_development_tools/150_script_a_rest/
    status: 200
  checked: '2026-09-13'
