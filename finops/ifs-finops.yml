specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: IFS
providerId: ifs
publisherName: Industrial and Financial Systems, IFS AB
serviceCategory: Enterprise Software
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - ERP
  - EAM
  - Field Service
  - Enterprise Service Management
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for IFS Cloud. Billing is enterprise-subscription with negotiated
  per-customer terms; APIs are bundled and not separately metered. FinOps practice for IFS focuses on
  license-and-subscription accountability rather than per-call telemetry.
notes: No public usage-based meters; treat invoiced subscription cost and module utilization as the primary
  meters. Reconcile with the customer's own IFS Cloud Lifecycle Experience reporting.
sources:
  - https://www.ifs.com/
  - https://www.ifs.com/products/cloud
principles:
  - name: Visibility
    description: Surface IFS Cloud subscription costs in finance reporting; use IFS Lifecycle Experience
      for module and environment usage telemetry.
  - name: Allocation
    description: Allocate the IFS subscription across business units by module entitlement, named user
      counts, and active environments (production / test / development).
  - name: Optimization
    description: Right-size named-user counts, retire unused environments at renewal, and consolidate
      modules where overlap exists between EAM, FSM, and ESM.
  - name: Accountability
    description: Designate an IFS application owner with a single annual budget line; review module and
      user utilization quarterly with the IFS Customer Success Manager.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Budgeting
      - Benchmarking
  - name: Optimize Usage and Cost
    capabilities:
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Enterprise Subscription
  billingFrequency: Annual
  billingCurrency: USD/EUR/GBP
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: IFS Cloud
  ServiceCategory: Enterprise Software
  ProviderName: IFS
  PublisherName: Industrial and Financial Systems, IFS AB
  InvoiceIssuerName: Industrial and Financial Systems, IFS AB
  PricingCategory: Subscription
  PricingUnit: user-year
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: named_users
    description: Named users under license per module
    unit: user-month
    aggregation: max
    dimensions:
      - module
      - environment
  - name: environments
    description: Active IFS Cloud environments (production, test, development)
    unit: environment-month
    aggregation: max
    dimensions:
      - environment_type
      - region
  - name: modules
    description: Licensed product modules
    unit: module
    aggregation: max
    dimensions:
      - product_line
