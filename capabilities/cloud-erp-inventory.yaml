naftiko: 1.0.0-alpha2
info:
  label: IFS Cloud ERP API — Inventory
  description: 'IFS Cloud ERP API — Inventory. 1 operations. Lead operation: List parts from part catalog. Self-contained
    Naftiko capability covering one Ifs business surface.'
  tags:
  - Ifs
  - Inventory
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    IFS_API_KEY: IFS_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-erp-inventory
    baseUri: https://{tenant}.ifs.cloud/main/ifsapp/data
    description: IFS Cloud ERP API — Inventory business capability. Self-contained, no shared references.
    resources:
    - name: PART_CATALOG_API
      path: /PART_CATALOG_API
      operations:
      - name: listparts
        method: GET
        description: List parts from part catalog
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $filter
          in: query
          type: string
        - name: $top
          in: query
          type: integer
        - name: $skip
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.IFS_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-erp-inventory-rest
    port: 8080
    description: REST adapter for IFS Cloud ERP API — Inventory. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/part-catalog-api
      name: part-catalog-api
      description: REST surface for PART_CATALOG_API.
      operations:
      - method: GET
        name: listparts
        description: List parts from part catalog
        call: cloud-erp-inventory.listparts
        with:
          $filter: rest.$filter
          $top: rest.$top
          $skip: rest.$skip
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-erp-inventory-mcp
    port: 9090
    transport: http
    description: MCP adapter for IFS Cloud ERP API — Inventory. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-parts-part-catalog
      description: List parts from part catalog
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-erp-inventory.listparts
      with:
        $filter: tools.$filter
        $top: tools.$top
        $skip: tools.$skip
      outputParameters:
      - type: object
        mapping: $.
