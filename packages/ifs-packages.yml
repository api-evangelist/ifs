method: searched
source: https://developer.ifs.com/ (IFS Developer Portal tool catalog, assets/tools-info.json) + registry lookups on npm, PyPI, NuGet, Maven Central, RubyGems, crates.io, pkg.go.dev
summary: >-
  IFS publishes NO first-party API client SDK to any public package registry. A search of
  npm (registry.npmjs.org search + direct name lookups), PyPI, NuGet
  (azuresearch-usnc.nuget.org) and the other registries returned nothing owned by IFS —
  the npm package `ifs-cloud-mcp` and the PyPI package `ifs` are both third-party and are
  recorded below only so a later run does not mistake them for first-party.
  What IFS does publish first-party is a catalog of Windows/.NET developer TOOLS,
  distributed as direct downloads (Azure Blob / developer.ifs.com assets) with no registry
  metadata endpoint. Those are listed below with the version the portal states. They are
  development tooling, not API client libraries, so NO `SDKs` pointer is emitted for this
  file — sdk_count for IFS is genuinely 0.
sdk_count: 0
