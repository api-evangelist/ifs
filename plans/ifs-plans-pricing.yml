description: >-
  IFS publishes NO pricing and NO plan tiers. IFS Cloud (ERP, EAM, FSM, ESM) is sold through a
  contact-sales motion; commercial terms are negotiated per customer against the IFS Master
  Terms and Product Terms, and the APIs are part of the licensed product rather than a
  separately metered product with its own plans. There is no self-serve signup that yields
  IFS Cloud API credentials — an IAM client must be registered by an administrator inside the
  customer's own environment (see authentication/ifs-authentication.yml).
notes: >-
