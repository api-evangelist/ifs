specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: IFS
providerId: ifs
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - ERP
  - EAM
  - Field Service
  - Enterprise Service Management
  - Industrial Software
description: IFS sells industry-specific enterprise software (IFS Cloud ERP, EAM, FSM, ESM) through a
  contact-sales motion. Pricing is not published and is negotiated per customer based on industry, modules,
  user count, and deployment shape (cloud vs on-premises). The APIs underlying these products are part
  of the licensed product and not separately metered. IFS announced in 2024 a move toward more accessible
  enterprise pricing but specific rates remain undisclosed.
notes: No public per-user or per-API pricing is published. All numeric prices below are 'contact sales'.
sources:
  - https://www.ifs.com/
  - https://www.ifs.com/products/cloud
plans:
  - id: ifs-cloud
    name: IFS Cloud
    type: enterprise
    description: Unified IFS Cloud platform covering ERP, EAM, FSM, and ESM. Sold via IFS Sales with a
      negotiated contract; APIs are bundled with the product license.
    entries:
      - label: Subscription
        description: Negotiated subscription covering modules and user count
        name: subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        domains:
          - https://api.ifs.com
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: IFS Cloud ERP API
      - name: IFS Field Service Management API
      - name: IFS Enterprise Asset Management API
      - name: IFS Enterprise Service Management API
      - name: Industry-specific data models
      - name: 24/7 enterprise support
      - name: Customer Success Manager
