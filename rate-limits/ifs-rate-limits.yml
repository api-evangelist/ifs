# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - ERP
  - EAM
  - Field Service
  - Rate Limiting
description: IFS does not publish public rate-limit numbers for its IFS Cloud APIs. Throughput is governed
  by the customer's contracted environment sizing and the application server's connection pools rather
  than by a documented per-key TPS ceiling. Limits captured here describe documented governance surfaces
  generically; specific values must be obtained from the customer's IFS Cloud tenant configuration.
notes: No public IFS rate-limit documentation page reachable. Customers should consult their IFS Cloud
  Technical Documentation in Lifecycle Experience for tenant-specific governance.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Tenant API throughput
    scope: tenant
    metric: varies
    limit: governed by contracted IFS Cloud environment sizing
    applies:
      - IFS Cloud ERP API
      - IFS Field Service Management API
      - IFS Enterprise Asset Management API
      - IFS Enterprise Service Management API
policies:
  - name: Backoff Strategy
    description: Clients receiving 429 or 503 should implement exponential backoff with jitter and honor
      Retry-After when present.
  - name: Capacity Sizing
    description: Throughput is driven by the contracted environment tier and application server pool
      configuration; raise capacity by working with the IFS Customer Success team rather than expecting
      automatic burst.
  - name: Fair Use
    description: IFS reserves the right to throttle traffic that materially impacts shared infrastructure.
maintainers:
