- id: ifs-cloud-interoperability
  name: IFS Cloud Interoperability (IFS Cloud <-> IFS.ai)
  kind: event-bus
  standard: CloudEvents
  evidence: >-
    "With IFS Cloud Interoperability, IFS Cloud integrates seamlessly with the IFS.ai
    platform using standardized CloudEvents and asynchronous messaging."
  evidence_url: https://docs.ifs.com/techdocs/26r1/030_administration/030_integration/350_ifs_cloud_interoperability/
  architecture:
    inbound:
      description: >-
        The IFS.ai platform sends an event in CloudEvent format to an authenticated endpoint
        routed through a proxy service. A Quarkus service named CloudEventReceiver validates
        the request and checks the event type is registered, then enqueues the message to an
        Oracle Advanced Queue (AQ). IFS Cloud components consume from the queue and act on it.
      services:
      - CloudEventReceiver (Quarkus)
      queue: Oracle Advanced Queue (AQ)
    outbound:
      description: >-
        Outbound messages are produced either by Oracle database triggers writing into an AQ
        when specific tables change, or programmatically by IFS Cloud components on a business
        event. A containerized CloudEventSender service reads the outbound queue, transforms
        each message into a CloudEvent structure and sends it to the IFS.ai platform.
      services:
      - CloudEventSender
      triggers:
      - database-trigger
      - application-driven-event
  subscription_required: false
  customer_facing: false
  note: >-
    This path is IFS-internal plumbing between IFS Cloud and the IFS.ai platform. It is
    enabled automatically for the relevant product capabilities and requires no customer
    subscription, but it is not an endpoint a third-party integrator subscribes to.
