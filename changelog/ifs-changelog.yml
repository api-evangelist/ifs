    - 26R1
    note: >-
      IFS Cloud ships two release updates a year plus service updates between them. Policy
      (docs.ifs.com/policy/APIUsageCloud.pdf) is that no breaking API change is made in a
      service update; breaking changes in a release update are published with the release
      information at Early Access, and cumulatively in the API diff workbooks listed in
      lifecycle/ifs-lifecycle.yml.
  developer_tools:
    name: IFS developer tool releases
    note: >-
      Dated per-tool announcements on the developer portal. This is the only dated,
      machine-readable changelog IFS publishes on an anonymous surface; the IFS Cloud
      product release notes and the deprecation log live in the IFS Community knowledge
      base, which requires an account.
